# Run on the operator's local device. Only outbound HTTPS is needed for messages.
services:
  node:
    image: ${OYA_NODE_IMAGE:-oya-node:local}
    user: ${OYA_CONTAINER_USER:-1000:1000}
    entrypoint: [node, /app/src/inbox/worker.mjs]
    command: [/config/node.json, /run/secrets/node.env, /config/worker.json, /run/secrets/worker.json]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - type: bind
        source: ${OYA_LOCAL_DIR:?Set OYA_LOCAL_DIR}/node.json
        target: /config/node.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OYA_LOCAL_DIR:?Set OYA_LOCAL_DIR}/node.env
        target: /run/secrets/node.env
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OYA_LOCAL_DIR:?Set OYA_LOCAL_DIR}/worker.json
        target: /config/worker.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OYA_LOCAL_DIR:?Set OYA_LOCAL_DIR}/worker-secrets.json
        target: /run/secrets/worker.json
        read_only: true
        bind: {create_host_path: false}
    ports: ["127.0.0.1:${OYA_HTTP_PORT:-8787}:8787"]
    depends_on:
      ipfs: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/healthz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
  ipfs:
    image: ipfs/kubo:v0.43.0@sha256:63f5502f7a01b82a675e45bae81b2f5dfa90248ec4a86cd0a58c218347e1f2d2
    environment: {IPFS_PROFILE: server}
    volumes: [ipfs-data:/data/ipfs]
    ports: ["${OYA_IPFS_PORT:-4001}:4001/tcp", "${OYA_IPFS_PORT:-4001}:4001/udp"]
    healthcheck:
      test: [CMD, ipfs, "--api=/ip4/127.0.0.1/tcp/5001", id]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 1m
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
volumes:
  ipfs-data:
