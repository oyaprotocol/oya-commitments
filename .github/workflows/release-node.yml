name: Release node
run-name: Node ${{ inputs.version }}${{ inputs.dry_run && ' (preview)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Unused stable version, for example 0.4.1'
        required: true
        type: string
      dry_run:
        description: 'Build and verify locally without publishing'
        type: boolean
        default: false
      notes:
        description: 'Optional release highlights and required upgrade instructions'
        type: string
        default: ''

permissions: {}

# Serialize different versions too, so latest-release selection cannot race.
concurrency:
  group: node-release
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'oyaprotocol/oya-commitments'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      ci_passed: ${{ steps.check.outputs.ci_passed }}
      directory_base: ${{ steps.directory-base.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Resolve peer directory comparison base
        id: directory-base
        run: |
          base=$(git rev-parse --verify HEAD^1)
          printf 'sha=%s\n' "$base" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Validate source and unused version
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        run: node node/production/scripts/release-node.mjs check "$RELEASE_VERSION"

  tests:
    needs: preflight
    if: needs.preflight.outputs.ci_passed != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      directory_base: ${{ needs.preflight.outputs.directory_base }}

  publish:
    needs: [preflight, tests]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.tests.result == 'success' || needs.preflight.outputs.ci_passed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Authenticate publication
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish or preview the tested source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          command=release
          if [ "$RELEASE_DRY_RUN" = true ]; then command=preview; fi
          node node/production/scripts/release-node.mjs "$command" "$RELEASE_VERSION" "$RUNNER_TEMP/node-release"
      - name: Retain release output for verification or recovery
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/node-release/
          if-no-files-found: ignore
          retention-days: 30
      - name: Clear registry credentials
        if: ${{ always() && !inputs.dry_run }}
        run: docker logout ghcr.io
