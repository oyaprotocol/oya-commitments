name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

  contracts:
    name: Hardened contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test --offline -vvv

  packages:
    name: Kernel packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/package-lock.json

      - name: Install package dependencies
        working-directory: packages
        run: npm ci

      - name: Build packages
        working-directory: packages
        run: npm run build

      - name: Verify package build output is fresh
        run: git diff --exit-code -- packages

  production-node:
    name: Production node
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: node/production/package-lock.json

      - name: Install production node dependencies
        run: npm --prefix node/production ci --ignore-scripts

      - name: Test production node
        run: npm --prefix node/production test

  docker-node:
    name: Docker node publication and lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: node/production/package-lock.json

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Prepare host sender and Ledger deployment
        run: |
          npm --prefix node/production ci --ignore-scripts
          forge build --root contracts

      - name: Test Linux amd64 publication and lifecycle
        run: npm --prefix node/production run test:docker -- --verbose --platform linux/amd64

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Build Linux arm64 image without publishing
        run: docker buildx build --platform linux/arm64 --output "type=oci,dest=$RUNNER_TEMP/oya-node-arm64.tar" node/production
